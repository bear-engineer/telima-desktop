[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bear-engineer/telima-desktop"
publish = false

[workspace.dependencies]
telima-core = { path = "crates/telima-core" }
telima-app = { path = "crates/telima-app" }
telima-colima = { path = "crates/telima-colima" }
telima-docker = { path = "crates/telima-docker" }
telima-ui = { path = "crates/telima-ui" }
# GPUI: gpui-kit pins the gpui-pre snapshot exactly; bump only in lockstep.
gpui-kit = "=0.9.1"
bollard = "=0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# OS tray: tray-icon on macOS, ksni (StatusNotifierItem) on Linux. Exact pins.
tray-icon = "=0.26.1"
ksni = "=0.3.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 1
debug = false
